server:
  port: 8080
spring:
  application:
    name: loans
  config:
    import: configserver:http://configserver:8071/
  datasource:
    url: jdbc:mysql://192.168.145.108:3307/loansdb
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  rabbitmq:
    host: "192.168.145.108"
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
    env:
      show-values: always
  info:
    env:
      enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true

eureka:
  security:
    user:
      name: admin
      password: password
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://${eureka.security.user.name}:${eureka.security.user.password}@localhost:8070/eureka/
    # Client local cache update frequency
    registry-fetch-interval-seconds: 30
  instance:
    preferIpAddress: true
    # Interval between two heartbeats sent to the server
    lease-renewal-interval-in-seconds: 30
    # Expiration time before eviction if no more heartbeat
    lease-expiration-duration-in-seconds: 90

build:
  version: "3.0"